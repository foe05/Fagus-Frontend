# Fixed project name so that `docker compose` always targets the same
# container + volume regardless of which directory it is invoked from.
# Without this, the project name is derived from the working directory,
# which caused a split between `fagus_frontend` (deployed) and
# `fagus-frontend` (workspace) and almost overwrote the WP data volume
# with an empty one.
name: fagus_frontend

services:
  fagus:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: fagus
    restart: unless-stopped
    ports:
      - "3080:80"
    volumes:
      - wp_content:/var/www/wordpress/wp-content
    environment:
      # WordPress Site URL (anpassen an echte Domain)
      - WP_URL=http://91.99.188.249:3080
      # Next.js WordPress API (intern im Container: Next.js -> Nginx -> PHP-FPM)
      - WP_API_URL=http://127.0.0.1/wp-json/wp/v2
      # Kontaktformular: E-Mails werden via wp_mail() / WP Mail SMTP gesendet.
      # Empfaenger konfigurierbar als WP-Option (fagus_contact_email), Standard: hallo@broetzens.de
      # Zentrales Logging (log.broetzens.de). API-Key kommt aus .env (gitignored).
      # Leer = Logging deaktiviert (graceful no-op in app/api/log/route.ts).
      - LOGGING_API_KEY=${LOGGING_API_KEY:-}
      # WordPress Debug (optional)
      # - WP_DEBUG=true
    networks:
      - proxy

volumes:
  # Marked external so Compose will never create a fresh empty volume
  # if the name doesn't match — it fails loudly instead. Create once with:
  #   docker volume create fagus_frontend_wp_content
  wp_content:
    name: fagus_frontend_wp_content
    external: true

networks:
  proxy:
    external: true
