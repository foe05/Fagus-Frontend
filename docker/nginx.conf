user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 64M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    upstream nextjs {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name _;

        root /var/www/wordpress;
        index index.php index.html;

        # ── Security ────────────────────────────────
        location = /wp-config.php { deny all; }
        location ~ /\.ht { deny all; }
        location ~ /wp-content/database { deny all; }

        # ── WordPress: Admin, Login, Cron ───────────
        location /wp-admin {
            try_files $uri $uri/ /wp-admin/index.php?$args;
            location ~ \.php$ {
                include fastcgi_params;
                fastcgi_pass unix:/run/php/php-fpm.sock;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                fastcgi_read_timeout 300;
            }
        }

        location = /wp-login.php {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location = /wp-cron.php {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location = /xmlrpc.php {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # ── WordPress: REST API ─────────────────────
        # Rewrite to rest_route so the API works regardless of WP permalink settings
        location /wp-json/ {
            rewrite ^/wp-json/(.*)$ /index.php?rest_route=/$1&$args last;
        }

        # WordPress: index.php handler (REST API rewrites + permalink fallback)
        location = /index.php {
            include fastcgi_params;
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # ── WordPress: Static content ───────────────
        location /wp-content/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /wp-includes/ {
            expires 7d;
            add_header Cache-Control "public";
            location ~ \.php$ {
                include fastcgi_params;
                fastcgi_pass unix:/run/php/php-fpm.sock;
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            }
        }

        # ── Next.js: Everything else ────────────────
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # ── Next.js: Static assets ──────────────────
        location /_next/static/ {
            proxy_pass http://nextjs;
            expires 365d;
            add_header Cache-Control "public, immutable";
        }
    }
}
