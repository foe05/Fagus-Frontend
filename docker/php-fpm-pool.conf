[www]
user = www-data
group = www-data

listen = /run/php/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

# Worker erben die Container-Umgebung (docker-compose `environment:`), damit
# getenv() in PHP funktioniert — u.a. CARD_MAIL_TOKEN (fagus-card-mail.php) und
# WP_URL (wp-config.php). Ohne dies strippt PHP-FPM die Worker-Umgebung.
clear_env = no

php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 300
